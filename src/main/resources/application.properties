spring.application.name=privatedrop-backend

# DB connection
spring.datasource.url=jdbc:postgresql://localhost:5432/privatedrop
spring.datasource.username=privatedrop_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep database access within the service layer
spring.jpa.open-in-view=false

# Logging
logging.level.org.springframework.security=INFO

# JPA database
spring.jpa.hibernate.ddl-auto=update